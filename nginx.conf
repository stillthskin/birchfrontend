server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

  # Hashed build files can be cached for a year.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # Single-page app: always serve index.html, never cache it.
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }

  # Optional: proxy API calls to your backend so the browser stays on one origin.
  # Then build with VITE_API_URL=/api and remove CORS needs. Example for a backend on the same Docker network:
  # location /api/ { proxy_pass http://backend:4000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}
