name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CONTAINER: birch

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_USE_MOCK=${{ vars.VITE_USE_MOCK || 'true' }}
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes $SSH_USER@$SSH_HOST"

          # Let the server pull the (private) image. The token only lives for this job.
          printf '%s' "$REGISTRY_TOKEN" | $SSH "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          $SSH "IMAGE='${IMAGE}:${{ github.sha }}' APP_PORT='$APP_PORT' CONTAINER='$CONTAINER' bash -s" <<'REMOTE'
          set -euo pipefail
          docker pull "$IMAGE"

          prev=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$CONTAINER" --restart unless-stopped -p "$APP_PORT":8080 "$IMAGE" >/dev/null

          ok=""
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo starting)
            if [ "$s" = "healthy" ]; then ok=1; break; fi
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "New version did not become healthy. Logs:"
            docker logs --tail 50 "$CONTAINER" || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            if [ -n "$prev" ]; then
              echo "Rolling back to $prev"
              docker run -d --name "$CONTAINER" --restart unless-stopped -p "$APP_PORT":8080 "$prev" >/dev/null
            fi
            exit 1
          fi

          docker image prune -f >/dev/null
          docker logout ghcr.io >/dev/null 2>&1 || true
          echo "Deployed $IMAGE"
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
