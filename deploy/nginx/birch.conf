# nginx site for https://birch.denniskenda.com
#   /      -> web container on 127.0.0.1:8080
#   /api/  -> your backend on 127.0.0.1:8081
# Installed by deploy/server-setup.sh to /etc/nginx/sites-available/birch

limit_req_zone $binary_remote_addr zone=birch_login:10m rate=10r/m;

upstream birch_web { server 127.0.0.1:8080; keepalive 8; }
upstream birch_api { server 127.0.0.1:8081; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name birch.denniskenda.com;

    # Lets Encrypt renewals
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name birch.denniskenda.com;

    ssl_certificate     /etc/letsencrypt/live/birch.denniskenda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/birch.denniskenda.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Post images can be up to 8 MB.
    client_max_body_size 10m;

    # Slow down password guessing on sign-in.
    location = /api/auth/login {
        limit_req zone=birch_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://birch_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend. The /api prefix is passed through, so your backend serves /api/auth/login, /api/loans, ...
    # If your backend serves routes WITHOUT the /api prefix, change the line below to:  proxy_pass http://birch_api/;
    # M-Pesa callbacks also arrive here, e.g. https://birch.denniskenda.com/api/payments/mpesa/callback
    location /api/ {
        proxy_pass http://birch_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Front end (the Docker container)
    location / {
        proxy_pass http://birch_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
